spring:
  application:
    name: bussola-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/bussola?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:NovaSenhaAqui}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/bussola}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

bussola:
  jwt:
    secret: ${JWT_SECRET:SU97GMLh2J/K9QiN7T+0D1x8AuhXHtARiIMnrCBVMuKX1UJo0/7r7caR8IZK3fjZ}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    br.com.bussola.backend: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
